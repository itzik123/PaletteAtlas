name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned by "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      # The app's UI tests drive a real browser.
      - run: pnpm --filter @palette-atlas/app exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The site as built and tested, handed to the deploy job; only main goes live.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: app/dist

  # Publishes the site to Cloudflare Pages once every check has passed. Cloudflare serves it from a
  # private repo for free; GitHub Pages takes over once the repo goes public. Needs two repo
  # secrets: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages, Edit) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    # One deployment at a time, and a newer push never cancels one under way.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Creates the project on the first deploy; afterwards it exists and this does nothing.
          preCommands: wrangler pages project create palette-atlas --production-branch=main || true
          command: pages deploy site --project-name=palette-atlas --branch=main
